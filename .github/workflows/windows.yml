# Windows 版：在 GitHub 的 Windows 測試機（沒有顯示卡）跑 install.ps1、照瀏覽器的方式啟動本機程式轉文字和翻譯、再跑 uninstall.ps1。
name: Windows
on:
  push:
    paths:
      - install.ps1
      - install.cmd
      - uninstall.ps1
      - uninstall.cmd
      - host/**
      - tests/test_native_host.py
      - .github/workflows/windows.yml
  workflow_dispatch:
jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: install.cmd（等於在檔案總管點兩下）
        shell: cmd
        run: install.cmd
      - name: 本機程式（native messaging）
        shell: powershell
        run: host\.venv\Scripts\python.exe tests\test_native_host.py
      - name: host.log
        if: always()
        shell: powershell
        run: Get-Content "$HOME\.cache\tab-transcriber\host.log" -Tail 40 -ErrorAction SilentlyContinue; Get-Content "$HOME\.cache\tab-transcriber\llama-server.log" -Tail 20 -ErrorAction SilentlyContinue
      - name: 單元測試
        shell: powershell
        run: host\.venv\Scripts\python.exe -m unittest tests/test_repeats.py tests/test_hints.py
      - name: uninstall.cmd
        shell: powershell
        run: |
          cmd /c uninstall.cmd
          if (Test-Path 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.tab_transcriber.host') { throw '登錄檔沒有移除' }
