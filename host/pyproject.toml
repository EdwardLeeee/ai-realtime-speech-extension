[project]
name = "tab-transcriber-host"
version = "0.1.0"
description = "Tab Transcriber 的本機轉文字程式（native messaging host）"
requires-python = ">=3.12"
dependencies = [
    "av<19",  # av 19 拿掉了 faster-whisper 1.2.1 呼叫 av.open 時用的 metadata_errors 參數
    "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
]
