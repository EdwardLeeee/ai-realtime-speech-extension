<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>錄音轉文字稿</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div class="status-row">
      <span id="dot" class="dot" aria-hidden="true"></span>
      <span id="status" class="status">尚未開始</span>
      <span id="elapsed" class="elapsed"></span>
      <span class="text-size" role="group" aria-label="文字稿的字體大小">
        <button id="smaller" class="tool" type="button" aria-label="字小一點" title="字小一點">A−</button>
        <button id="bigger" class="tool" type="button" aria-label="字大一點" title="字大一點">A+</button>
      </span>
      <button id="collapse" class="tool" type="button" title="收起側邊欄，錄音不會停。錄音中點工具列的圖示就會再打開">收起</button>
    </div>
    <div id="source" class="source"></div>
    <div class="meter" aria-hidden="true"><div id="meter-fill" class="meter-fill"></div></div>
    <div class="options">
      <select id="language" aria-label="錄音的語言">
        <option value="en">英文</option>
        <option value="ja">日文</option>
        <option value="th">泰文</option>
      </select>
      <label class="switch" title="在每句原文下面加上繁體中文翻譯（用這台電腦上的翻譯模型）">
        <input id="bilingual" type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
        雙語字幕
      </label>
      <label class="switch" title="錄音時在播放的網頁上浮著可以拖動的即時字幕，影片全螢幕時也看得到">
        <input id="overlay" type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
        網頁字幕
      </label>
      <label class="switch" title="YouTube 影片有字幕（CC）時直接用播放器的字幕，不用 Whisper 聽，也不佔顯示卡。CC 沒開時會幫你打開，停止時關回去">
        <input id="yt-captions" type="checkbox" role="switch">
        <span class="track" aria-hidden="true"></span>
        YouTube 字幕
      </label>
      <span id="bilingual-hint" class="hint"></span>
    </div>
    <label class="hints" title="Whisper 常拼錯的人名、隊名、術語，用逗號分開（例如 donk, MOUZ, Five-SeveN）。每種語言分開記住；錄音中改了，下一句就照著拼">
      <span>專有名詞</span>
      <input id="hints" type="text" maxlength="400" placeholder="人名、隊名…用逗號分開" spellcheck="false" autocomplete="off">
    </label>
    <div class="actions">
      <button id="toggle" class="primary" type="button">開始</button>
      <button id="copy" type="button">複製</button>
      <button id="download" type="button">下載 .txt</button>
      <button id="clear" class="quiet" type="button">清除</button>
    </div>
    <p id="message" class="message" hidden></p>
  </header>

  <main id="transcript" class="transcript" aria-live="polite"></main>

  <section id="empty" class="empty">
    <p>先在上面選好語言，再到播放錄音的分頁點瀏覽器工具列的 <strong>Tab Transcriber</strong> 圖示，就會開始。</p>
    <p>打開「雙語字幕」，每句下面會加上繁體中文翻譯，錄音中也可以隨時開關。</p>
    <p>「網頁字幕」開著時，播放的網頁上會浮著可以拖動的即時字幕，影片全螢幕時也看得到。</p>
    <p>常被轉錯的人名、隊名（例如 donk, MOUZ）填進「專有名詞」，Whisper 就會照著拼。</p>
    <p>打開「YouTube 字幕」，有 CC 的 YouTube 影片就直接用播放器的字幕，整部影片的字幕會一次放進文字稿，時間是影片本身的時間。</p>
    <p>每句前面的時間是從開始錄音算起。聲音、文字稿和翻譯都只在這台電腦上處理。</p>
  </section>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
